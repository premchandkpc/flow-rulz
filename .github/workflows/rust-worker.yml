name: Rust worker

on:
  pull_request:
    paths:
      - "rust-worker/**"
      - "cmd/worker/**"
      - "internal/**"
      - "examples/direct-worker/**"
      - "go.mod"
      - "go.sum"
      - "Dockerfile.worker-rust"
      - "docker-compose.yml"
      - ".github/workflows/rust-worker.yml"
  push:
    branches: [main, "feat/**"]
    paths:
      - "rust-worker/**"
      - "cmd/worker/**"
      - "internal/**"
      - "examples/direct-worker/**"
      - "go.mod"
      - "go.sum"
      - "Dockerfile.worker-rust"
      - "docker-compose.yml"
      - ".github/workflows/rust-worker.yml"

permissions:
  contents: read

jobs:
  rust-worker:
    runs-on: ubuntu-latest
    services:
      nats:
        image: nats:2.11.7
        ports:
          - 4222:4222
    defaults:
      run:
        working-directory: rust-worker
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-worker
      - name: Format Rust sources
        run: cargo fmt --all -- --check
      - name: Run Rust unit tests
        run: cargo test --all-targets --locked
      - name: Run Rust Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Build native Rust broker
        run: cargo build --locked
      - name: Build Go protocol peer
        working-directory: .
        run: go build -o "$RUNNER_TEMP/flowrulz-go-peer" ./cmd/worker
      - name: Verify broker transports, cross-runtime protocol and crash recovery
        run: python3 tests/broker_protocol.py --go-worker "$RUNNER_TEMP/flowrulz-go-peer" --nats-address 127.0.0.1:4222
      - name: Build standalone Rust worker image
        working-directory: .
        run: docker build -f Dockerfile.worker-rust -t flow-rulz-rust-worker:test .
