services:
  # Add a codegen service for local development.
  codegen:
    build:
      context: .
      dockerfile: Dockerfile.codegen
    volumes:
      - .:/app
      - ./examples:/examples
      - ./generated:/generated
    command: ["sleep", "infinity"]
    profiles:
      - tools

  # Add a migrate service for running migrations
  migrate:
    image: golang:1.26-alpine
    container_name: flow-rulz-migrate
    working_dir: /app
    volumes:
      - .:/app
    command: ["sh", "-c", "apk add --no-cache git && go run ./cmd/migrate up"]
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/flow-rulz?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - tools

  # Development database with persisted data
  postgres:
    volumes:
      - ./data/postgres:/var/lib/postgresql/data

  nats:
    volumes:
      - ./data/nats:/data

  redis:
    volumes:
      - ./data/redis:/data
