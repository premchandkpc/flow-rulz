name: order.payment_success
version: "1.0"
namespace: com.example.ecommerce
description: Event emitted when payment succeeds
fields:
  order_id:
    type: string
    description: Unique order identifier
    required: true
  customer_id:
    type: string
    description: Customer who placed the order
    required: true
  payment_id:
    type: string
    description: Payment identifier
    required: true
  amount:
    type: number
    description: Payment amount in cents
    required: true
  currency:
    type: string
    description: Currency code
    required: true
    default: "USD"
  payment_method:
    type: string
    description: Payment method used
    required: true
  completed_at:
    type: string
    format: date-time
    description: Payment completion timestamp
    required: true
compatibility: BACKWARD
owner: ecommerce-team
deprecated: false