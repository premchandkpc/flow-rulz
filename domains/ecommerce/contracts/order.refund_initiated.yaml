name: order.refund_initiated
version: "1.0"
namespace: com.example.ecommerce
description: Event emitted when refund is initiated
fields:
  order_id:
    type: string
    description: Unique order identifier
    required: true
  customer_id:
    type: string
    description: Customer who placed the order
    required: true
  refund_id:
    type: string
    description: Refund identifier
    required: true
  amount:
    type: number
    description: Refund amount in cents
    required: true
  currency:
    type: string
    description: Currency code
    required: true
    default: "USD"
  reason:
    type: string
    description: Reason for refund
    required: true
  payment_id:
    type: string
    description: Original payment identifier
    required: true
  initiated_at:
    type: string
    format: date-time
    description: Refund initiation timestamp
    required: true
compatibility: BACKWARD
owner: ecommerce-team
deprecated: false