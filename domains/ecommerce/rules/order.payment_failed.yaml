rule_set: order.payment_failed
revision: 1
mode: all_matches
rules:
  - id: notify_payment_failed
    name: "Notify Payment Failed"
    description: "Notify customer of payment failure with retry options"
    priority: 100
    when:
      path: "$.order_id"
      op: "exists"
    then:
      - emit_event:
          type: "notification.requested"
          partition_key_policy: "inherit"
          data:
            notification_id: "{{new_id}}"
            order_id: "{{$.order_id}}"
            customer_id: "{{$.customer_id}}"
            type: "payment_failed"
            message: "Your payment failed: {{$.failure_reason}}. Retry count: {{$.retry_count}}"
            payment_id: "{{$.payment_id}}"
            failure_reason: "{{$.failure_reason}}"
            retry_count: "{{$.retry_count}}"
            created_at: "{{now}}"
  - id: schedule_payment_retry
    name: "Schedule Payment Retry"
    description: "Schedule automatic payment retry for failed payments (up to 3 times)"
    priority: 80
    when:
      all:
        - path: "$.retry_count"
          op: "lt"
          value: 3
        - path: "$.order_id"
          op: "exists"
    then:
      - emit_event:
          type: "payment.retry_scheduled"
          partition_key_policy: "inherit"
          data:
            order_id: "{{$.order_id}}"
            payment_id: "{{$.payment_id}}"
            retry_count: "{{$.retry_count}}"
            scheduled_at: "{{now}}"
            retry_after_minutes: 15
  - id: initiate_refund_for_max_retries
    name: "Initiate Refund After Max Retries"
    description: "Start refund process when payment retries are exhausted"
    priority: 60
    when:
      all:
        - path: "$.retry_count"
          op: "gte"
          value: 3
        - path: "$.order_id"
          op: "exists"
    then:
      - emit_event:
          type: "order.refund_initiated"
          partition_key_policy: "inherit"
          data:
            refund_id: "{{new_id}}"
            order_id: "{{$.order_id}}"
            customer_id: "{{$.customer_id}}"
            amount: "{{$.amount}}"
            currency: "{{$.currency}}"
            reason: "Payment failed after maximum retries"
            payment_id: "{{$.payment_id}}"
            initiated_at: "{{now}}"